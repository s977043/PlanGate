name: sync-plugin-plangate

# plugin/plangate/ を main push のたびに .claude/ と同期し、差分あり時に PR を自動作成。
# merge は Human-owned (C-4)。

on:
  push:
    branches: [main]
    paths:
      - '.claude/**'
      - '.agents/skills/**'
      - 'CHANGELOG.md'
      - 'docs/ai/ai-loop/**'
      - 'docs/workflows/ai-loop/**'
      - 'scripts/ai-loop/**'
      - 'scripts/_ai_loop_link_rewrite.py'
      - 'scripts/sync-plugin-plangate.sh'
      - 'plugin/plangate/**'
  pull_request:
    paths:
      - '.claude/**'
      - '.agents/skills/**'
      - '.codex/skills/**'
      - 'docs/ai/ai-loop/**'
      - 'docs/workflows/ai-loop/**'
      - 'scripts/ai-loop/**'
      - 'scripts/_ai_loop_link_rewrite.py'
      - 'scripts/sync-plugin-plangate.sh'
      - 'plugin/plangate/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-plugin-plangate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR 段階で plugin/plangate/ と正本の drift を検出する (#842 R-005)。
  # push 後の同期 PR だけでは「main にマージされてから気づく」構造のため、
  # PR 時点で sync 実行後の差分ゼロを必須とする。
  drift-check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Verify plugin/plangate is in sync with sources
        run: |
          sh scripts/sync-plugin-plangate.sh
          if ! git diff --quiet -- plugin/plangate/; then
            echo "::error::plugin/plangate/ が正本と乖離しています。ローカルで 'sh scripts/sync-plugin-plangate.sh' を実行し、結果をコミットしてください。"
            git diff --stat -- plugin/plangate/
            exit 1
          fi
          echo "plugin/plangate/ is in sync with sources."

      - name: Verify .codex/skills mirrors .agents/skills canon (#1226)
        # 対象は installer が無変換 cp する SKILL.md と references/*.md のみ。
        # agents/openai.yaml は frontmatter を正規化して生成されるため byte 比較の
        # 対象外。assets/ は plugin/plangate/assets が出所で per-skill 正本を持たない
        # （scripts/install-plangate-skills-to-codex.sh 実測）。
        # 既定シェルは bash -eo pipefail。`diff | head` は head の早期終了で rc=1 に
        # なり errexit でステップが即終了して 1 件目しか報告されないため、パイプは
        # `|| true` で閉じ、全件を報告してから最後に rc を返す。
        run: |
          rc=0
          # canon -> mirror（欠落・乖離）
          for _d in .agents/skills/*/; do
            _n=$(basename "$_d")
            for _c in "${_d}SKILL.md" "${_d}references"/*.md; do
              [ -f "$_c" ] || continue
              _b=$(basename "$_c")
              case "$_c" in
                *references/*) _m=".codex/skills/$_n/references/$_b" ;;
                *) _m=".codex/skills/$_n/$_b" ;;
              esac
              if [ ! -f "$_m" ]; then
                echo "::error::$_m missing (canon: $_c)"
                rc=1
              elif ! cmp -s "$_c" "$_m"; then
                echo "::error::$_m diverges from $_c -- re-run scripts/install-plangate-skills-to-codex.sh --force and commit the result"
                diff -u "$_c" "$_m" | head -40 || true
                rc=1
              fi
            done
          done
          # mirror -> canon（正本に無い面が .codex 側にだけ存在しないこと）
          for _m in .codex/skills/*/; do
            _n=$(basename "$_m")
            if [ ! -d ".agents/skills/$_n" ]; then
              echo "::error::.codex/skills/$_n has no canon under .agents/skills/"
              rc=1
              continue
            fi
            for _r in "${_m}references"/*.md; do
              [ -f "$_r" ] || continue
              _b=$(basename "$_r")
              if [ ! -f ".agents/skills/$_n/references/$_b" ]; then
                echo "::error::$_r has no canon under .agents/skills/$_n/references/"
                rc=1
              fi
            done
          done
          exit "$rc"

  sync:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Codex skill spec check
        run: sh scripts/check-codex-skill-spec.sh --warn-only

      - name: Run sync script
        run: sh scripts/sync-plugin-plangate.sh

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- plugin/plangate/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR if changed
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="chore/plugin-sync-${{ github.run_id }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add plugin/plangate/
          git commit -m "chore(plugin): .claude/ → plugin/plangate/ 自動同期"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(plugin): plugin/plangate/ 自動同期" \
            --body "push to main をトリガーに \`scripts/sync-plugin-plangate.sh\` が .claude/ との差分を検出しました。merge は Human-owned (C-4)。"
