name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  settings-drift:
    name: settings wiring drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: settings wiring 契約 ↔ settings.example.json 整合（TASK-0080 S2）
        run: sh scripts/check-settings-wiring.sh --target example

  skip-ack:
    name: SKIP_REASON 追認
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: EH-3 SKIP の人間追認確認（TASK-0082 S5）
        run: sh scripts/check-skip-acknowledged.sh

  shell-lint:
    name: shellcheck (shell static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck version
        run: shellcheck --version

      - name: Shell lint gate (severity=error)
        run: sh scripts/lint-shell.sh --require-tool

      - name: Shell lint advisory (severity=warning, non-gating)
        run: sh scripts/lint-shell.sh --advisory --require-tool

  workflow-lint:
    name: actionlint (workflow static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint (pinned version + sha256 verified)
        run: |
          set -eu
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/actionlint.tar.gz" "$url"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
          sudo install -m 0755 "${RUNNER_TEMP}/actionlint" /usr/local/bin/actionlint
          actionlint -version

      - name: Workflow lint gate
        run: sh scripts/lint-workflows.sh --require-tool

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            README.md
            CHANGELOG.md
            .github/PULL_REQUEST_TEMPLATE.md
            CODE_OF_CONDUCT.md
            CONTRIBUTING.md
            SECURITY.md
            docs/index.md
            docs/pages/explanation/product/philosophy.md
            docs/pages/guides/governance/oss-governance.md
            docs/workflows/**/*.md
