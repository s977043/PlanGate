name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  settings-drift:
    name: settings wiring drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: settings wiring 契約 ↔ settings.example.json 整合（TASK-0080 S2）
        run: sh scripts/check-settings-wiring.sh --target example

  skip-ack:
    name: SKIP_REASON 追認
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: EH-3 SKIP の人間追認確認（TASK-0082 S5）
        run: sh scripts/check-skip-acknowledged.sh

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25 # v24.0.0
        with:
          globs: |
            README.md
            CHANGELOG.md
            .github/PULL_REQUEST_TEMPLATE.md
            CODE_OF_CONDUCT.md
            CONTRIBUTING.md
            SECURITY.md
            docs/index.md
            docs/pages/explanation/product/philosophy.md
            docs/pages/guides/governance/oss-governance.md
            docs/workflows/**/*.md
